{% extends "base.html" %}
{% block content %}
<section class="container mx-auto px-4 py-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header & Tools -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <h2 class="text-xl font-extrabold text-slate-900 font-heading">لوحة التدريب</h2>
      </div>
      
      <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-100">
        <span class="text-xs font-bold text-slate-500">كلمة التدريب:</span>
        <select id="refLetter" class="bg-white border border-slate-200 rounded px-2 py-1 text-sm font-bold outline-none cursor-pointer">
          <option value="فن">فن</option>
          <option value="خط">خط</option>
          <option value="الحمد">الحمد</option>
          <option value="محمد">محمد</option>
          <option value="بِسْمِ">بِسْمِ</option>
          <option value="ر">ر</option>
          <option value="ل">ل</option>
          <option value="م">م</option>
        </select>
        <span class="text-xs text-slate-400">أو</span>
        <input id="customRefText" type="text" placeholder="نص مخصص..." class="bg-white border border-slate-200 rounded px-2 py-1 text-sm w-32 outline-none"/>
        <button id="applyRefBtn" class="bg-slate-800 text-white px-3 py-1 rounded text-xs font-bold hover:bg-emerald-600 transition-colors">تحديث</button>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Toolbar -->
      <div class="bg-slate-50 border-b border-slate-200 p-3 flex flex-wrap items-center gap-4 justify-between">
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-600">حجم القلم:</span>
            <input id="pen" type="range" min="2" max="24" value="10" class="w-24 accent-emerald-600">
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-600">شفافية المرجع:</span>
            <input id="ghostOpacity" type="range" min="0" max="100" value="8" class="w-24 accent-slate-400">
          </div>
        </div>
        
        <div class="flex items-center gap-2">
          <button id="undoBtn" class="p-2 bg-white border border-slate-200 rounded hover:text-emerald-600 transition" title="تراجع">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 14L4 9l5-5"></path><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
          </button>
          <button id="redoBtn" class="p-2 bg-white border border-slate-200 rounded hover:text-emerald-600 transition" title="إعادة">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 14l5-5-5-5"></path><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
          </button>
          <div class="w-px h-6 bg-slate-300 mx-1"></div>
          <button id="eraseBtn" class="px-3 py-1.5 bg-white border border-slate-200 rounded text-sm hover:text-rose-600 transition flex items-center gap-1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"></path><path d="M17 17L7 7"></path></svg>
            ممحاة
          </button>
          <button id="clearBtn" class="px-3 py-1.5 bg-white border border-slate-200 rounded text-sm hover:bg-slate-100 transition">مسح</button>
          <button id="downloadBtn" class="px-3 py-1.5 bg-white border border-slate-200 rounded text-sm hover:bg-slate-100 transition flex items-center gap-1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            حفظ
          </button>
        </div>
      </div>

      <!-- Drawing Pad -->
      <div class="relative bg-[#fafafa] cursor-crosshair overflow-hidden" id="padWrap">
        <div id="ghost" class="absolute inset-0 flex items-center justify-center select-none pointer-events-none text-[160px] md:text-[220px] font-bold text-slate-900 transition-opacity duration-300" style="opacity:.08; font-family: 'Amiri', serif;">فن</div>
        <canvas id="pad" class="relative z-10 w-full h-[450px]"></canvas>
        <div id="guides" class="pointer-events-none absolute inset-0 z-0"></div>
      </div>
      
      <!-- Canvas Footer -->
      <div class="bg-slate-50 border-t border-slate-200 p-3 flex justify-between items-center">
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="gridToggle" type="checkbox" checked class="w-4 h-4 text-emerald-600 rounded">
            <span class="text-xs text-slate-600">إظهار الشبكة</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="linesToggle" type="checkbox" checked class="w-4 h-4 text-emerald-600 rounded">
            <span class="text-xs text-slate-600">الخطوط الإرشادية</span>
          </label>
        </div>
        <button id="analyzeBtn" class="btn-primary text-white px-6 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-sm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          حلل خطي الآن
        </button>
      </div>
    </div>

    <!-- Results Area -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row gap-8 items-start">
      <div class="flex flex-col items-center justify-center min-w-[200px]">
        <div class="w-32 h-32 rounded-full border-4 border-slate-100 flex items-center justify-center relative overflow-hidden">
           <div id="scoreCircle" class="absolute inset-0 border-8 border-emerald-500 rounded-full transition-all duration-1000" style="clip-path: inset(0 0 0 0);"></div>
           <span id="scoreValue" class="text-4xl font-black text-slate-900 font-heading">—</span>
        </div>
        <p class="mt-2 text-sm font-bold text-slate-500">جودة الخط</p>
      </div>
      
      <div class="flex-grow">
        <h3 class="text-lg font-bold text-slate-900 mb-3 border-b border-slate-100 pb-2">التوصيات والتحليل الذكي</h3>
        <div id="feedback" class="space-y-2 text-slate-700 text-sm">
          <p class="text-slate-400 italic">قم بالكتابة على اللوحة واضغط على زر التحليل للحصول على النتائج.</p>
        </div>
        
        <div class="mt-6 pt-4 border-t border-slate-100">
           <button onclick="document.getElementById('metricsPanel').classList.toggle('hidden')" class="text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-1">
             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
             عرض البيانات التقنية (للمطورين)
           </button>
           <div id="metricsPanel" class="hidden mt-3">
             <pre id="metrics" class="bg-slate-900 text-emerald-400 p-3 rounded-lg overflow-auto text-[10px] font-mono leading-relaxed" dir="ltr">{}</pre>
           </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
