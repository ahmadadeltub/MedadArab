
{% extends "base.html" %}
{% block content %}
<section class="container mx-auto px-6 py-12">
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Main Drawing Area -->
    <div class="flex-grow space-y-6">
      <div class="bg-white rounded-[32px] shadow-sm border border-slate-100 overflow-hidden">
        <div class="p-6 border-b border-slate-50 flex flex-wrap items-center justify-between gap-4 bg-slate-50/50">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-200">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5zM2 2l7.586 7.586"></path></svg>
            </div>
            <div>
              <h2 class="text-xl font-extrabold text-slate-900">لوحة التدريب الذكية</h2>
              <p class="text-xs text-slate-500 font-medium">اكتب، حلّل، وتطوّر</p>
            </div>
          </div>
          
          <div class="flex items-center gap-3 bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm">
            <select id="refLetter" class="bg-transparent border-none focus:ring-0 text-sm font-bold px-3 py-1.5 cursor-pointer outline-none">
              <option value="فن">فن</option>
              <option value="خط">خط</option>
              <option value="الحمد">الحمد</option>
              <option value="محمد">محمد</option>
              <option value="بِسْمِ">بِسْمِ</option>
              <option value="ر">ر</option>
              <option value="ل">ل</option>
              <option value="م">م</option>
            </select>
            <div class="h-6 w-px bg-slate-100"></div>
            <input id="customRefText" type="text" placeholder="نص مخصص..." class="bg-transparent border-none focus:ring-0 text-sm w-32 px-2 outline-none"/>
            <button id="applyRefBtn" class="bg-slate-900 text-white px-4 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-600 transition-colors">تحديث</button>
          </div>
        </div>

        <div class="p-6">
          <div class="relative rounded-3xl overflow-hidden border-2 border-slate-50 bg-[#fafafa] shadow-inner cursor-crosshair" id="padWrap">
            <div id="ghost" class="absolute inset-0 flex items-center justify-center select-none pointer-events-none text-[160px] md:text-[220px] font-bold text-slate-900 transition-opacity duration-300" style="opacity:.08; font-family: 'Amiri', serif;">فن</div>
            <canvas id="pad" class="relative z-10 block w-full h-[450px] transition-opacity duration-300"></canvas>
            <div id="guides" class="pointer-events-none absolute inset-0 z-0"></div>
          </div>

          <!-- Tools Palette -->
          <div class="mt-8 flex flex-wrap items-center justify-between gap-6 p-4 bg-slate-50 rounded-[24px] border border-slate-100">
            <div class="flex items-center gap-6">
              <div class="flex flex-col gap-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">حجم القلم</span>
                <input id="pen" type="range" min="2" max="24" value="10" class="w-32 accent-emerald-600">
              </div>
              <div class="flex flex-col gap-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">شفافية المرجع</span>
                <input id="ghostOpacity" type="range" min="0" max="100" value="8" class="w-32 accent-slate-400">
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button id="undoBtn" title="تراجع" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-emerald-600 hover:border-emerald-200 transition-all shadow-sm">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 14L4 9l5-5"></path><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
              </button>
              <button id="redoBtn" title="إعادة" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-emerald-600 hover:border-emerald-200 transition-all shadow-sm">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 14l5-5-5-5"></path><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
              </button>
              <div class="w-px h-8 bg-slate-200 mx-1"></div>
              <button id="eraseBtn" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-bold hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 transition-all shadow-sm flex items-center gap-2">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"></path><path d="M17 17L7 7"></path></svg>
                ممحاة
              </button>
              <button id="clearBtn" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-100 transition-all shadow-sm">مسح اللوحة</button>
              <button id="downloadBtn" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-100 transition-all shadow-sm flex items-center gap-2">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                حفظ
              </button>
            </div>

            <button id="analyzeBtn" class="btn-primary text-white px-8 py-3 rounded-2xl text-sm font-extrabold flex items-center gap-3">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              تحليل بالذكاء الاصطناعي
            </button>
          </div>
          
          <div class="mt-4 flex items-center gap-6 px-4">
            <label class="flex items-center gap-2 cursor-pointer group">
              <input id="gridToggle" type="checkbox" checked class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300">
              <span class="text-xs font-bold text-slate-500 group-hover:text-slate-700">إظهار شبكة العمل</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer group">
              <input id="linesToggle" type="checkbox" checked class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300">
              <span class="text-xs font-bold text-slate-500 group-hover:text-slate-700">الخطوط الإرشادية</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar Results -->
    <div class="lg:w-96 space-y-6">
      <div class="bg-white rounded-[32px] shadow-sm border border-slate-100 overflow-hidden sticky top-32">
        <div class="p-6 border-b border-slate-50 bg-slate-50/50">
          <h2 class="text-xl font-extrabold text-slate-900">نتائج التحليل</h2>
        </div>
        <div class="p-8 space-y-8">
          <!-- Score Visual -->
          <div class="relative flex flex-col items-center justify-center py-4">
            <div class="w-32 h-32 rounded-full border-8 border-slate-50 flex items-center justify-center relative overflow-hidden">
               <div id="scoreCircle" class="absolute inset-0 border-8 border-emerald-500 rounded-full transition-all duration-1000" style="clip-path: inset(0 0 0 0);"></div>
               <span id="scoreValue" class="text-4xl font-black text-slate-900">—</span>
            </div>
            <p class="mt-4 text-sm font-bold text-slate-400">معدل الإتقان العام</p>
          </div>

          <!-- Suggestions -->
          <div>
            <h3 class="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
              توصيات ذكية
            </h3>
            <div id="feedback" class="space-y-3">
              <p class="text-sm text-slate-400 italic">ابدأ الكتابة ثم اضغط على زر التحليل للحصول على التوصيات...</p>
            </div>
          </div>

          <!-- Technical Metrics -->
          <div class="pt-6 border-t border-slate-50">
             <button onclick="document.getElementById('metricsPanel').classList.toggle('hidden')" class="w-full flex items-center justify-between text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors uppercase tracking-widest">
               <span>البيانات التقنية</span>
               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
             </button>
             <div id="metricsPanel" class="hidden mt-4">
               <pre id="metrics" class="bg-slate-900 text-emerald-400 p-4 rounded-2xl overflow-auto text-[10px] font-mono leading-relaxed shadow-inner">{}</pre>
             </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
