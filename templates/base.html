
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Arabic -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --secondary: #0f172a;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      scroll-behavior: smooth;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Cairo', sans-serif;
    }
    .btn-primary {
      background-color: var(--primary);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background-color: var(--primary-dark);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen font-sans">
  <header class="bg-white shadow-sm border-b border-slate-200">
    <nav class="container mx-auto flex items-center justify-between py-4 px-6">

      <a href="/" class="flex items-center gap-3 font-extrabold text-2xl text-slate-900 group">
        <div class="bg-emerald-600 text-white p-2 rounded-xl group-hover:rotate-12 transition-transform shadow-lg shadow-emerald-200">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
        </div>
        <span class="tracking-tight">مداد الذكي</span>
      </a>
      <div class="hidden md:flex items-center gap-8 font-medium">
        <a href="/" class="hover:text-emerald-600 transition-colors">الرئيسية</a>
        <a href="/practice" class="hover:text-emerald-600 transition-colors">لوحة التدريب</a>
        <a href="#how-it-works" class="hover:text-emerald-600 transition-colors">كيف يعمل؟</a>
        <a href="/practice" class="btn-primary text-white px-6 py-2.5 rounded-xl text-sm font-bold">ابدأ الآن</a>
      </div>
      <button class="md:hidden p-2 text-slate-600">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16m-7 6h7"></path></svg>
      </button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-900 text-slate-400 py-10 mt-auto">
    <div class="container mx-auto px-6">
      <div class="flex flex-col items-center justify-center text-center gap-4">
        <div class="flex items-center gap-2 font-bold text-lg text-white">
          <div class="bg-emerald-600 p-1 rounded-md">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5zM2 2l7.586 7.586"></path></svg>
          </div>
          <span>مداد الذكي</span>
        </div>
        <p class="max-w-md text-sm">منصة تعليمية رائدة لخدمة الثقافة العربية والحفاظ على هويتنا الجميلة باستخدام الذكاء الاصطناعي.</p>
        <div class="border-t border-slate-800 pt-4 w-full max-w-lg mt-4 text-xs flex justify-between">
          <p>© 2025 مداد الذكي. جميع الحقوق محفوظة.</p>
          <a href="https://arabcodeweek.alecso.org/" target="_blank" class="hover:text-white transition">الأسبوع العربي للبرمجة</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
